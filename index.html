<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Runable Websites — Hero Prototype</title><meta name="description" content="Create a business-ready website with Runable."><link rel="icon" type="image/svg+xml" href="assets/hero/runable-mark.svg"><style>
:root{--ink:#171717;--ease:cubic-bezier(.22,1,.36,1);--scene-scale:1}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink)}a{color:inherit}.hero{position:relative;width:100%;height:max(100svh,760px);overflow:hidden;background:#fff;isolation:isolate}.color-stack{position:absolute;z-index:0;inset:0;pointer-events:none}.color-wash{position:absolute;inset:0;opacity:0}.color-wash.active{opacity:1}.color-wash.incoming{animation:colorIn 1.65s var(--ease) forwards}
.nav{position:absolute;z-index:50;top:0;left:max(24px,calc((100% - 1200px)/2));right:max(24px,calc((100% - 1200px)/2));height:64px;display:flex;align-items:center;justify-content:space-between;padding:12px 0}.logo{width:234px;height:24px;display:flex;align-items:center}.logo img{width:27px;height:24px}.nav-menu,.nav-actions{display:flex;align-items:center;gap:8px}.nav-item,.login,.get-started{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 16px;border:2px solid #fff;border-radius:8px;text-decoration:none;font-size:16px;line-height:24px;background:linear-gradient(#fff,rgba(255,255,255,.25));box-shadow:0 2px 2px rgba(0,0,0,.04)}.nav-item.menu::after{content:"";width:6px;height:6px;margin-left:9px;border-right:1px solid;border-bottom:1px solid;transform:rotate(45deg) translateY(-2px)}.login,.get-started{padding:12px 24px}.get-started{color:#fff;background:#171717}
.copy{position:absolute;z-index:40;top:clamp(102px,15.5vh,140px);left:50%;width:min(940px,calc(100% - 40px));transform:translateX(-50%);text-align:center}.copy h1{margin:0;color:var(--ink);font:400 clamp(52px,6.12vw,88px)/.96 Georgia,"Times New Roman",serif;letter-spacing:clamp(-4px,-.28vw,-2px)}.copy p{width:min(602px,100%);margin:30px auto 0;color:#666;font-size:16px;line-height:24px}.primary{display:inline-flex;align-items:center;gap:8px;margin-top:20px;padding:12px 24px;min-height:48px;color:#fff;background:#171717;border:2px solid #fff;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.09);text-decoration:none;font-size:16px}.primary img{width:16px;height:16px}
.scene-window{position:absolute;z-index:1;left:0;right:0;top:380px;height:520px;overflow:visible}.scene-canvas{position:absolute;top:0;left:50%;width:1440px;height:520px;transform:translateX(-50%) scale(var(--scene-scale));transform-origin:top center}.scene{position:absolute;inset:0;opacity:0;filter:blur(26px);transform:scale(.982);transform-origin:center 42%;pointer-events:none}.scene.active{opacity:1;filter:blur(0);transform:scale(1)}.scene.incoming{animation:sceneIn 1.65s var(--ease) forwards}.scene.outgoing{animation:sceneOut 1.65s cubic-bezier(.4,0,.2,1) forwards}
.ambient{position:absolute;z-index:0;pointer-events:none;object-fit:cover;opacity:.1;filter:saturate(.75) contrast(.9)}.band{position:absolute;z-index:1;left:5px;top:0;width:1440px;height:160px;object-fit:cover;opacity:.94}.shot{position:absolute;z-index:4;margin:0;padding:8px;background:#fff;border:.5px solid rgba(0,0,0,.18);border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.055);overflow:hidden;will-change:transform}.shot img{display:block;width:100%;height:100%;border-radius:7px;object-fit:cover}.shot.left{left:97px;top:46px;width:377px;height:377px;z-index:3;animation:floatLeft 7.6s ease-in-out infinite}.shot.center{left:295px;top:124px;width:620px;height:358px;z-index:5;animation:floatCenter 8.4s ease-in-out -2.4s infinite}.shot.right{left:895px;top:50px;width:292px;height:292px;z-index:4;animation:floatRight 7.9s ease-in-out -4.1s infinite}.prompt{position:absolute;z-index:8;left:849px;top:356px;width:387px;height:97px;display:flex;flex-direction:column;justify-content:space-between;padding:12px 16px;border:1px solid rgba(222,222,222,.55);border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 8px 25px rgba(0,0,0,.07)}.prompt-text{font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden}.prompt-char{display:inline-block;opacity:0;filter:blur(7px);transform:translateY(2px);animation:charIn .46s var(--ease) forwards}.prompt-controls{display:flex;align-items:center;justify-content:space-between}.prompt-controls>img{width:17px;height:17px}.submit{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#1a1a1a}.submit img{width:18px;height:18px}
@keyframes colorIn{from{opacity:0}to{opacity:1}}@keyframes sceneIn{0%{opacity:0;filter:blur(28px);transform:scale(.978)}35%{opacity:.28;filter:blur(20px)}100%{opacity:1;filter:blur(0);transform:scale(1)}}@keyframes sceneOut{0%{opacity:1;filter:blur(0);transform:scale(1)}65%{opacity:.22;filter:blur(18px)}100%{opacity:0;filter:blur(28px);transform:scale(1.018)}}@keyframes charIn{to{opacity:1;filter:blur(0);transform:none}}@keyframes floatLeft{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-5px,-8px,0) rotate(-.18deg)}}@keyframes floatCenter{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(0,-10px,0) rotate(.12deg)}}@keyframes floatRight{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(5px,-7px,0) rotate(.2deg)}}@media(max-width:1050px){.nav{left:28px;right:28px}.nav-menu{display:none}.copy{top:108px}.scene-window{top:370px}}@media(max-width:700px){.hero{height:max(100svh,680px)}.nav{left:18px;right:18px;height:58px}.logo{width:auto}.login{display:none}.get-started{min-height:38px;padding:8px 14px;font-size:14px}.copy{top:86px;width:calc(100% - 28px)}.copy h1{font-size:clamp(44px,13vw,62px);letter-spacing:-2.4px}.copy p{margin-top:18px;font-size:14px;line-height:20px}.primary{margin-top:16px;min-height:44px;padding:10px 18px;font-size:14px}.scene-window{top:390px;height:260px}}@media(max-width:420px){.scene-window{top:380px}}@media(prefers-reduced-motion:reduce){.color-wash.incoming,.scene.incoming,.scene.outgoing,.prompt-char,.shot{animation-duration:.01ms!important}}
@font-face{font-family:"Hedvig Letters Serif";src:url("assets/hero/hedvig-letters-serif-regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}.copy h1{font-family:"Hedvig Letters Serif",ui-serif,Georgia,serif;opacity:0;filter:blur(20px);transform:translateY(16px);animation:heroIntro 1.35s var(--ease) .18s forwards;will-change:opacity,filter,transform}.copy p{opacity:0;filter:blur(14px);transform:translateY(12px);animation:heroIntro 1.2s var(--ease) .52s forwards;will-change:opacity,filter,transform}.primary{opacity:0;filter:blur(12px);transform:translateY(10px) scale(.985);animation:heroIntro 1.1s var(--ease) .82s forwards;will-change:opacity,filter,transform}@keyframes heroIntro{to{opacity:1;filter:blur(0);transform:none}}@media(prefers-reduced-motion:reduce){.copy h1,.copy p,.primary{opacity:1;filter:none;transform:none;animation:none!important}}
@font-face{font-family:"Satoshi";src:url("assets/hero/satoshi-400.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}@font-face{font-family:"Satoshi";src:url("assets/hero/satoshi-500.woff2") format("woff2");font-style:normal;font-weight:500;font-display:swap}body{font-family:"Satoshi",Arial,sans-serif;font-weight:500}.copy h1{font-size:clamp(44px,6.111vw,88px);line-height:clamp(42px,5.833vw,84px);letter-spacing:clamp(-4px,-.278vw,-2px);font-weight:400}.copy p{width:min(602px,100%);margin-top:16px;font-size:16px;line-height:24px;letter-spacing:-.1px;font-weight:500}.primary{margin-top:24px;font-size:16px;line-height:24px;letter-spacing:-.1px;font-weight:500}.nav-item,.login,.get-started{font-size:16px;line-height:24px;letter-spacing:-.1px;font-weight:500}
.copy h1{font-size:88px;line-height:84px;letter-spacing:-4px}@media(max-width:1050px){.copy h1{font-size:72px;line-height:69px;letter-spacing:-3.3px}}@media(max-width:700px){.copy h1{font-size:46px;line-height:44px;letter-spacing:-2.4px}}
</style></head><body><main class="hero"><div class="color-stack" id="color-stack"></div><nav class="nav" aria-label="Primary navigation"><a class="logo" href="#" aria-label="Runable home"><img src="assets/hero/runable-mark.svg" alt=""></a><div class="nav-menu"><a class="nav-item menu" href="#">Capabilities</a><a class="nav-item menu" href="#">Solutions</a><a class="nav-item menu" href="#">Resources</a><a class="nav-item" href="#">Community</a><a class="nav-item" href="#">Pricing</a></div><div class="nav-actions"><a class="login" href="#">Login</a><a class="get-started" href="#">Get Started</a></div></nav>
<section class="copy"><h1>Create a website that means business</h1><p>Runable manages planning, drafting, designing, developing and publishing your site.</p><a class="primary" href="#">Create your website <img src="assets/hero/arrow-ne.svg" alt=""></a></section>
<div class="scene-window" aria-label="Websites generated by Runable"><div class="scene-canvas" id="scene-canvas"><div class="prompt"><div class="prompt-text" id="prompt-text"></div><div class="prompt-controls"><img src="assets/hero/add.svg" alt=""><span class="submit"><img src="assets/hero/submit.svg" alt=""></span></div></div></div></div></main><script>
const scenes=[{key:'realestate',color:'#fef2e1',prompt:'Make a website for my real estate agency..',bg:{x:-49,y:-67,w:1627,h:922},left:{w:377,h:377},right:{w:292,h:292}},{key:'atelier',color:'#f0e2e0',prompt:'Create a bold portfolio for my creative agency..',bg:{x:56,y:-100,w:1307,h:741},left:{w:341,h:341},right:{w:276,h:276}},{key:'designer',color:'#fee6e6',prompt:'Design an elegant site for my personal brand..',bg:{x:74,y:-80,w:1293,h:733},left:{w:377,h:377},right:{w:292,h:292}},{key:'fashion',color:'#d7e5f4',prompt:'Build a high-energy store for my fashion label..',bg:{x:74,y:-85,w:1293,h:732},left:{w:377,h:377},right:{w:292,h:292}},{key:'furniture',color:'#f4f5d6',prompt:'Make a refined shop for my furniture studio..',bg:{x:74,y:-6,w:1293,h:733},left:{w:377,h:377},right:{w:292,h:292}}],canvas=document.querySelector('#scene-canvas'),colorStack=document.querySelector('#color-stack'),promptText=document.querySelector('#prompt-text'),wait=ms=>new Promise(r=>setTimeout(r,ms));let current=0,busy=false;
function markup(s){return `<img class="ambient" src="assets/hero/bg-${s.key}.webp" alt="" style="left:${s.bg.x}px;top:${s.bg.y}px;width:${s.bg.w}px;height:${s.bg.h}px"><img class="band" src="assets/hero/bg-band.webp" alt=""><figure class="shot left" style="width:${s.left.w}px;height:${s.left.h}px"><img src="assets/hero/${s.key}-left.webp" alt=""></figure><figure class="shot center"><img src="assets/hero/${s.key}-center.webp" alt=""></figure><figure class="shot right" style="width:${s.right.w}px;height:${s.right.h}px"><img src="assets/hero/${s.key}-right.webp" alt=""></figure>`}
function createScene(s,className){const el=document.createElement('div');el.className='scene '+className;el.innerHTML=markup(s);canvas.appendChild(el);return el}
function createColor(s,className){const el=document.createElement('div');el.className='color-wash '+className;el.style.background=s.color;colorStack.appendChild(el);return el}
function fit(){const windowEl=document.querySelector('.scene-window'),top=windowEl.getBoundingClientRect().top,scale=Math.max(.2,Math.min(1,innerWidth/1440,(innerHeight-top)/520));document.documentElement.style.setProperty('--scene-scale',scale);windowEl.style.height=(520*scale)+'px'}addEventListener('resize',fit);fit();let active=createScene(scenes[0],'active'),activeColor=createColor(scenes[0],'active');
async function typePrompt(text){promptText.replaceChildren();for(const character of text){const span=document.createElement('span');span.className='prompt-char';span.textContent=character===' '?String.fromCharCode(160):character;promptText.appendChild(span);await wait(31)}}
async function changeScene(){if(busy)return;busy=true;const nextIndex=(current+1)%scenes.length;await typePrompt(scenes[nextIndex].prompt);await wait(420);const next=createScene(scenes[nextIndex],'incoming'),nextColor=createColor(scenes[nextIndex],'incoming');active.classList.remove('active');active.classList.add('outgoing');await wait(1690);active.remove();activeColor.remove();next.classList.remove('incoming');next.classList.add('active');nextColor.classList.remove('incoming');nextColor.classList.add('active');active=next;activeColor=nextColor;current=nextIndex;busy=false}
async function loop(){await typePrompt(scenes[0].prompt);await wait(1800);while(true){await changeScene();await wait(1750)}}loop();
</script></body></html>
