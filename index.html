const originalScenes=[{key:'realestate',color:'#fef2e1',prompt:'Make a website for my real estate agency..',bg:{x:-49,y:-67,w:1627,h:922},left:{w:377,h:377},right:{w:292,h:292}},{key:'atelier',color:'#f0e2e0',prompt:'Create a bold portfolio for my creative agency..',bg:{x:56,y:-100,w:1307,h:741},left:{w:341,h:341},right:{w:276,h:276}},{key:'designer',color:'#fee6e6',prompt:'Design an elegant site for my personal brand..',bg:{x:74,y:-80,w:1293,h:733},left:{w:377,h:377},right:{w:292,h:292}},{key:'fashion',color:'#d7e5f4',prompt:'Build a high-energy store for my fashion label..',bg:{x:74,y:-85,w:1293,h:732},left:{w:377,h:377},right:{w:292,h:292}},{key:'furniture',color:'#f4f5d6',prompt:'Make a refined shop for my furniture studio..',bg:{x:74,y:-6,w:1293,h:733},left:{w:377,h:377},right:{w:292,h:292}}],variantScenes=[{key:'01-wellness',color:'#e7eadc',prompt:'Create a thoughtful wellness website that feels human..',variant:true},{key:'02-coastal',color:'#eee7dc',prompt:'Design a calm coastal retreat website..',variant:true},{key:'03-skincare',color:'#fff1ef',prompt:'Build a bold skincare brand experience..',variant:true},{key:'04-studio',color:'#dcecc8',prompt:'Create a confident portfolio for my design studio..',variant:true},{key:'05-matcha',color:'#f3c4c8',prompt:'Make a joyful website for my matcha brand..',variant:true},{key:'06-workshop',color:'#b9e3f4',prompt:'Build a playful website for my creative workshop..',variant:true}],useAssetVariant=new URLSearchParams(location.search).get('assets')==='new',scenes=useAssetVariant?variantScenes:originalScenes,canvas=document.querySelector('#scene-canvas'),colorStack=document.querySelector('#color-stack'),promptText=document.querySelector('#prompt-text'),wait=ms=>new Promise(r=>setTimeout(r,ms));let current=0,busy=false,transitionMode='blocks';document.body.classList.add('mode-blocks');if(useAssetVariant)document.body.classList.add('asset-variant');document.querySelectorAll('.motion-option').forEach(button=>button.addEventL
