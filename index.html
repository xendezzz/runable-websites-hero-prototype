@keyframes reveal{to{opacity:1;filter:blur(0);transform:none}}@keyframes bgIntro{to{opacity:.1;filter:blur(0);transform:scale(1)}}@keyframes cardIntro{to{opacity:1;filter:blur(0);transform:translate3d(0,0,0) scale(1)}}@keyframes cardLeave{to{opacity:0;filter:blur(26px);transform:translate3d(0,34px,-180px) scale(.9)}}@keyframes cardEnter{from{opacity:0;filter:blur(28px);transform:translate3d(0,44px,-170px) scale(.91)}to{opacity:1;filter:blur(0);transform:translate3d(0,0,0) scale(1)}}@keyframes textOut{to{opacity:0;filter:blur(15px);transform:translateY(-5px)}}@keyframes textIn{from{opacity:0;filter:blur(15px);transform:translateY(6px)}to{opacity:1;filter:blur(0);transform:none}}@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(.01deg)}50%{transform:translate3d(0,-9px,18px) rotate(-.25deg)}}@keyframes blink{50%{opacity:0}}

@media(max-width:700px){body{overflow:auto}.viewport{min-height:820px}.stage{height:100svh;min-height:820px}.nav{left:18px;right:18px;height:60px}.logo{width:auto}.nav-actions .login{display:none}.get-started{padding:8px 14px;min-height:38px;font-size:14px}.copy{top:94px;width:calc(100% - 32px);gap:18px}.copy h1{font-size:clamp(48px,14vw,68px);line-height:.94;letter-spacing:-2.8px}.copy p{max-width:520px;margin-top:14px;font-size:15px;line-height:22px}.primary{min-height:46px;padding:11px 20px}.visual{top:42%;height:58%}.scene-bg{left:-34%!important;top:4%!important;width:168%!important;height:auto!important;min-height:470px}.scene-band{left:-25%;top:9%;width:150%;height:130px}.shot{padding:5px;border-radius:9px}.shot img{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:5px}.shot.left{left:-7%;top:18%;width:42vw;height:auto!important}.shot.center{left:10%;top:29%;width:80vw;height:46vw}.shot.right{left:75%;top:19%;width:36vw;height:auto!important}.prompt{left:50%;right:auto;top:auto;bottom:22px;width:min(390px,calc(100% - 32px));min-height:91px;transform:translateX(-50%);animation-name:promptMobile}.prompt-text{font-size:14px;white-space:normal;line-height:21px}@keyframes promptMobile{to{opacity:1;filter:blur(0);transform:translateX(-50%)}}}
@media(max-width:430px){.stage{min-height:760px}.copy{top:84px}.copy h1{font-size:46px}.copy p{font-size:14px;line-height:20px}.visual{top:43%}.shot.center{top:31%;height:49vw}.prompt{bottom:16px}.scene-band{top:12%}}

</style></head><body><main class="viewport"><section class="stage" aria-label="Runable AI website builder"><nav class="nav" aria-label="Primary navigation"><a class="logo" href="#" aria-label="Runable home"><img src="assets/hero/runable-mark.svg" alt=""></a><div class="nav-menu"><a class="nav-item menu" href="#">Capabilities</a><a class="nav-item menu" href="#">Solutions</a><a class="nav-item menu" href="#">Resources</a><a class="nav-item" href="#">Community</a><a class="nav-item" href="#">Pricing</a></div><div class="nav-actions"><a class="login" href="#">Login</a><a class="get-started" href="#">Get Started</a></div></nav>
<div class="copy"><div><h1>Create a website that means <span>business</span></h1><p>Runable manages planning, drafting, designing, developing and publishing your site.</p></div><a class="primary" href="#">Create your website <img src="assets/hero/arrow-ne.svg" alt=""></a></div>
<div class="visual" id="visual"><img class="scene-bg" id="scene-bg" src="assets/hero/bg-realestate.webp" alt=""><img class="scene-band" src="assets/hero/bg-band.webp" alt=""><figure class="shot left"><div class="float"><img src="assets/hero/realestate-left.webp" alt="Real estate listings website"></div></figure><figure class="shot center"><div class="float"><img src="assets/hero/realestate-center.webp" alt="Real estate agency website"></div></figure><figure class="shot right"><div class="float"><img src="assets/hero/realestate-right.webp" alt="Real estate insights website"></div></figure><div class="prompt"><div class="prompt-text blur-in" id="prompt-text">Make a website for my real estate agency..</div><div class="prompt-controls"><img src="assets/hero/add.svg" alt=""><span class="submit"><img src="assets/hero/submit.svg" alt=""></span></div></div></div>
</section></main><script>
const scenes=[{key:'realestate',prompt:'Make a website for my real estate agency..',bg:{w:113,h:102,x:-3.4,y:-9}},{key:'atelier',prompt:'Create a bold portfolio for my creative agency..',bg:{w:90.8,h:82,x:3.9,y:-14},left:[23.7,341],right:[19.2,276]},{key:'designer',prompt:'Design an elegant site for my personal brand..',bg:{w:89.8,h:81,x:5.1,y:-10}},{key:'fashion',prompt:'Build a high-energy store for my fashion label..',bg:{w:89.8,h:81,x:5.1,y:-11}},{key:'furniture',prompt:'Make a refined shop for my furniture studio..',bg:{w:89.8,h:81,x:5.1,y:0}}],wait=ms=>new Promise(r=>setTimeout(r,ms)),bg=document.querySelector('#scene-bg'),promptText=document.querySelector('#prompt-text'),shots=[...document.querySelectorAll('.shot')];let index=0;
function applyGeometry(s){bg.style.width=s.bg.w+'%';bg.style.height=s.bg.h+'%';bg.style.left=s.bg.x+'%';bg.style.top=s.bg.y+'%';if(innerWidth>1024){shots[0].style.width=(s.left?.[0]||26.18)+'vw';shots[0].style.height=s.left?.[1]?s.left[1]+'px':'';shots[2].style.width=(s.right?.[0]||20.28)+'vw';shots[2].style.height=s.right?.[1]?s.right[1]+'px':''}else{shots[0].style.width='';shots[0].style.height='';shots[2].style.width='';shots[2].style.height=''}}
async function changePrompt(text){promptText.className='prompt-text blur-out';await wait(560);promptText.textContent=text;promptText.className='prompt-text blur-in'}
async function transitionTo(s){for(const shot of [...shots].reverse()){shot.classList.remove('entering');shot.classList.add('leaving');await wait(280)}await wait(800);bg.classList.add('changing');await wait(1100);bg.src=`assets/hero/bg-${s.key}.webp`;applyGeometry(s);await wait(180);bg.classList.remove('changing');await wait(1100);await changePrompt(s.prompt);await wait(540);shots.forEach((shot,i)=>{shot.querySelector('img').src=`assets/hero/${s.key}-${['left','center','right'][i]}.webp`;shot.classList.remove('leaving');void shot.offsetWidth;shot.classList.add('entering')});await wait(2900);shots.forEach(shot=>shot.classList.remove('entering'))}
async function loop(){await wait(7000);while(true){index=(index+1)%scenes.length;await transitionTo(scenes[index]);await wait(4200)}}addEventListener('resize',()=>applyGeometry(scenes[index]));applyGeometry(scenes[0]);loop();
</script></body></html>
