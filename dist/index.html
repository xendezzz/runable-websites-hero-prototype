r:2px solid #fff;border-radius:8px;box-shadow:0 2px 2px rgba(0,0,0,.04);text-decoration:none;font-size:16px}.primary img{width:16px;height:16px}.scene-bg{position:absolute;z-index:1;object-fit:cover;pointer-events:none;opacity:.1;transition:width 1s ease,height 1s ease,left 1s ease,top 1s ease}.scene-band{position:absolute;z-index:2;left:5px;top:380px;width:1440px;height:160px;object-fit:cover;pointer-events:none}.shot{position:absolute;z-index:6;margin:0;padding:8px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.2);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.03);transform-style:preserve-3d;transition:width .9s ease,height .9s ease}.shot.left{left:97px;top:426px;width:377px;height:377px;z-index:5;animation:floatLeft 8s ease-in-out infinite}.shot.center{left:295px;top:504px;width:620px;height:358px;z-index:7;animation:floatCenter 9.5s ease-in-out infinite}.shot.right{left:1008px;top:430px;width:292px;height:292px;z-index:6;animation:floatRight 7.5s ease-in-out infinite}.shot img{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:cover;border-radius:7px;display:block;backface-visibility:hidden}.prompt{position:absolute;z-index:12;left:849px;top:736px;width:387px;height:97px;display:flex;flex-direction:column;justify-content:space-between;padding:12px 16px;border:1px solid rgba(222,222,222,.3);border-radius:12px;background:linear-gradient(#fff,rgba(255,255,255,.9));box-shadow:0 2px 4px rgba(0,0,0,.04)}.prompt-text{color:#1a1a1a;font-size:16px;line-height:24px;white-space:nowrap;overflow:hidden}.prompt-text::after{content:"";display:inline-block;width:1px;height:1em;margin-left:3px;background:#1a1a1a;vertical-align:-2px;animation:blink .8s steps(2) infinite}.prompt-controls{display:flex;align-items:center;justify-content:space-between}.prompt-controls>img{width:17px;height:17px}.submit{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#1a1a1a}.submit img{width:18px;height:18px}.dither{position:absolute;z-index:11;left:80px;top:365px;width:1240px;height:510px;opacity:0;pointer-events:none;mix-blend-mode:soft-light;image-rendering:pixelated}.dither.active{opacity:.16}.stage.morphing .shot{animation-play-state:paused}.scene-old{animation:oldCenter 1.05s cubic-bezier(.4,0,.2,1) forwards}.scene-new{opacity:0;filter:blur(18px);animation:newCenter 1.05s cubic-bezier(.16,1,.3,1) forwards}.left .scene-old{animation-name:oldLeft}.left .scene-new{animation-name:newLeft;animation-delay:70ms}.right .scene-old{animation-name:oldRight}.right .scene-new{animation-name:newRight;animation-delay:35ms}.center .scene-new{animation-delay:120ms}.bg-old{animation:bgOld 1.05s ease forwards}.bg-new{opacity:0;filter:blur(12px);animation:bgNew 1.05s ease forwards}
@keyframes floatLeft{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-5px,-8px,16px)}}@keyframes floatCenter{0%,100%{transform:translate3d(0,0,38px)}50%{transform:translate3d(0,-10px,52px)}}@keyframes floatRight{0%,100%{transform:translate3d(0,0,16px)}50%{transform:translate3d(5px,-7px,28px)}}@keyframes blink{50%{opacity:0}}@keyframes oldCenter{to{opacity:0;filter:blur(22px);transform:translate3d(0,14px,-130px) scale(.94)}}@keyframes newCenter{from{opacity:0;filter:blur(20px);transform:translate3d(0,-6px,-110px) scale(.95)}to{opacity:1;filter:blur(0);transform:none}}@keyframes oldLeft{to{opacity:0;filter:blur(20px);transform:translateX(-42px) scale(.9)}}@keyframes newLeft{from{opacity:0;filter:blur(19px);transform:translateX(48px) scale(.91)}to{opacity:1;filter:blur(0);transform:none}}@keyframes oldRight{to{opacity:0;filter:blur(20px);transform:translateX(42px) scale(.9)}}@keyframes newRight{from{opacity:0;filter:blur(19px);transform:translateX(-48px) scale(.91)}to{opacity:1;filter:blur(0);transform:none}}@keyframes bgOld{to{opacity:0;filter:blur(22px);transform:scale(.96)}}@keyframes bgNew{to{opacity:.1;filter:blur(0);transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><main class="viewport"><section class="stage" id="stage" aria-label="Runable AI website builder">
<nav class="nav" aria-label="Primary navigation"><a class="logo" href="#" aria-label="Runable home"><img src="assets/hero/runable-mark.svg" alt=""></a><div class="nav-menu"><a class="nav-item menu" href="#">Capabilities</a><a class="nav-item menu" href="#">Solutions</a><a class="nav-item menu" href="#">Resources</a><a class="nav-item" href="#">Community</a><a class="nav-item" href="#">Pricing</a></div><div class="nav-actions"><a class="login" href="#">Login</a><a class="get-started" href="#">Get Started</a></div></nav>
<div class="copy"><div><h1>Create a website that means <span>business</span></h1><p>Runable manages planning, drafting, designing, developing and publishing your site.</p></div><a class="primary" href="#">Create your website <img src="assets/hero/arrow-ne.svg" alt=""></a></div>
<img class="scene-bg" id="scene-bg" src="assets/hero/bg-realestate.webp" alt=""><img class="scene-band" src="assets/hero/bg-band.webp" alt="">
<figure class="shot left"><img id="shot-left" src="assets/hero/realestate-left.webp" alt="Real estate listings website"></figure><figure class="shot center"><img id="shot-center" src="assets/hero/realestate-center.webp" alt="Real estate agency website"></figure><figure class="shot right"><img id="shot-right" src="assets/hero/realestate-right.webp" alt="Real estate insights website"></figure>
<canvas class="dither" id="dither" aria-hidden="true"></canvas><div class="prompt"><div class="prompt-text" id="prompt-text">Make a website for my agency..</div><div class="prompt-controls"><img src="assets/hero/add.svg" alt=""><span class="submit"><img src="assets/hero/submit.svg" alt=""></span></div></div>
</section></main><script>
const scenes=[{key:'realestate',prompt:'Make a website for my real estate agency..',bg:{w:1627,h:922,x:-49,y:313}},{key:'atelier',prompt:'Create a bold portfolio for my creative agency..',bg:{w:1307,h:741,x:56,y:280},left:[341,341],right:[276,276]},{key:'designer',prompt:'Design an elegant site for my personal brand..',bg:{w:1293,h:733,x:74,y:300}},{key:'fashion',prompt:'Build a high-energy store for my fashion label..',bg:{w:1293,h:732,x:74,y:295}},{key:'furniture',prompt:'Make a refined shop for my furniture studio..',bg:{w:1293,h:733,x:74,y:374}}];
const stage=document.querySelector('#stage'),promptText=document.querySelector('#prompt-text'),dither=document.querySelector('#dither');let index=0,timer,raf,changing=false;
function fit(){stage.style.setProperty('--stage-scale',Math.min(innerWidth/1440,innerHeight/900))}addEventListener('resize',fit);fit();
function applyGeometry(s){const bg=document.querySelector('#scene-bg');Object.assign(bg.style,{width:s.bg.w+'px',height:s.bg.h+'px',left:s.bg.x+'px',top:s.bg.y+'px'});const l=document.querySelector('.shot.left'),r=document.querySelector('.shot.right');l.style.width=(s.left?.[0]||377)+'px';l.style.height=(s.left?.[1]||377)+'px';r.style.width=(s.right?.[0]||292)+'px';r.style.height=(s.right?.[1]||292)+'px'}
async function typePrompt(t){promptText.textContent='';for(let i=0;i<=t.length;i++){promptText.textContent=t.slice(0,i);await new Promise(r=>setTimeout(r,18+Math.random()*15))}}
function ditherSweep(){cancelAnimationFrame(raf);const sc=.3,w=dither.width=Math.floor(1240*sc),h=dither.height=Math.floor(510*sc),ctx=dither.getContext('2d'),start=performance.now();dither.classList.add('active');function draw(now){const p=Math.min(1,(now-start)/1050),im=ctx.createImageData(w,h),wave=p*(w+80)-40;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,dist=Math.abs(x-wave-12*Math.sin(y*.11+p*9)),n=Math.random();if(dist<34&&n>(dist/44)*.7){const heat=1-dist/34;im.data[i]=255;im.data[i+1]=100+Math.floor(130*(1-heat));im.data[i+2]=160+Math.floor(95*(1-heat));im.data[i+3]=Math.floor(180*heat*(n>.52?1:.35))}}ctx.putImageData(im,0,0);if(p<1)raf=requestAnimationFrame(draw);else{dither.classList.remove('active');ctx.clearRect(0,0,w,h)}}raf=requestAnimationFrame(draw)}
async function morph(s){stage.classList.add('morphing');ditherSweep();const entries=[['#shot-left','left'],['#shot-center','center'],['#shot-right','right']];const pairs=entries.map(([sel,pos])=>{const old=document.querySelector(sel);old.classList.add('scene-old');const next=old.cloneNode();next.id=old.id;old.removeAttribute('id');next.src='assets/hero/'+s.key+'-'+pos+'.webp';next.className='scene-new';old.parentElement.appendChild(next);return[old,next]});const oldBg=document.querySelector('#scene-bg');oldBg.classList.add('bg-old');const nextBg=oldBg.cloneNode();nextBg.id='scene-bg';oldBg.removeAttribute('id');nextBg.src='assets/hero/bg-'+s.key+'.webp';nextBg.className='scene-bg bg-new';oldBg.parentElement.insertBefore(nextBg,oldBg.nextSibling);applyGeometry(s);await new Promise(r=>setTimeout(r,1180));pairs.forEach(([old,next])=>{old.remove();next.className=''});oldBg.remove();nextBg.className='scene-bg';stage.classList.remove('morphing')}
async function nextScene(){if(changing)return;changing=true;clearTimeout(timer);index=(index+1)%scenes.length;const s=scenes[index];await typePrompt(s.prompt);await new Promise(r=>setTimeout(r,140));await morph(s);changing=false;timer=setTimeout(nextScene,2700)}applyGeometry(scenes[0]);timer=setTimeout(nextScene,2700);
</script></body></html>
